name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        # conftest.py adds the repo's parent dir to sys.path so `documind.x.y` resolves.
        run: pytest -q tests/ --maxfail=1 --disable-warnings

      - name: Smoke test ingest + retrieval pipeline
        # The `documind` package lives at the repo root, so we step up one dir
        # before `python -m` (the same trick conftest.py uses for tests).
        run: |
          REPO_DIR="$(basename "$GITHUB_WORKSPACE")"
          cd ..
          python -m "${REPO_DIR}.ingest" --path "${REPO_DIR}/docs_sample" --collection ci_smoke
          REPO_DIR="${REPO_DIR}" python <<'PY'
          import os, sys
          repo = os.environ["REPO_DIR"]
          mod = __import__(f"{repo}.retrieval.vector_store", fromlist=["VectorStore"])
          VectorStore = mod.VectorStore
          mod = __import__(f"{repo}.retrieval.retriever", fromlist=["Retriever"])
          Retriever = mod.Retriever
          mod = __import__(f"{repo}.ingestion.embedder", fromlist=["Embedder"])
          Embedder = mod.Embedder
          store = VectorStore("ci_smoke")
          assert store.count() > 0, "ingest produced no chunks"
          r = Retriever(store, Embedder())
          chunks = r.retrieve("how does the GIL affect threading?", k=3)
          assert len(chunks) > 0, "retrieval returned nothing"
          assert chunks[0].score > 0.5, f"top result has low score: {chunks[0].score}"
          print(f"smoke OK: {len(chunks)} chunks, top score {chunks[0].score:.3f}")
          PY
